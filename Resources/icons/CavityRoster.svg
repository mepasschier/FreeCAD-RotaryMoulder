<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- rounded tile (the cavity floor) -->
  <rect x="8" y="8" width="48" height="48" rx="7" fill="#deaa6a" stroke="#5a3a18" stroke-width="2.5"/>
  <!-- raised lattice bars -->
  <g stroke="#5a3a18" stroke-width="3.2" stroke-linecap="round">
    <!-- vertical bars -->
    <line x1="24" y1="12" x2="24" y2="52"/>
    <line x1="40" y1="12" x2="40" y2="52"/>
    <!-- horizontal bars -->
    <line x1="12" y1="24" x2="52" y2="24"/>
    <line x1="12" y1="40" x2="52" y2="40"/>
  </g>
  <!-- highlight on bars to read as raised -->
  <g stroke="#f0c98a" stroke-width="1.0" stroke-linecap="round">
    <line x1="24" y1="12" x2="24" y2="52"/>
    <line x1="40" y1="12" x2="40" y2="52"/>
    <line x1="12" y1="24" x2="52" y2="24"/>
    <line x1="12" y1="40" x2="52" y2="40"/>
  </g>
</svg>
